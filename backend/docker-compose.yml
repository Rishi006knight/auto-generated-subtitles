version: "3.8"

services:
  subtitle-asr-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subtitle-asr-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
