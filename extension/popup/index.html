<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitle AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="3" ry="3"></rect>
            <path d="M7 15h4M13 15h4M7 11h10"></path>
          </svg>
        </div>
        <div>
          <h1>Subtitle AI</h1>
          <div class="status-indicator">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Disconnected</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-controls">Controls</button>
      <button class="tab-btn" data-tab="tab-styles">Subtitle Style</button>
    </div>

    <!-- Tab 1: Controls -->
    <div class="tab-content active" id="tab-controls">
      <!-- Main Action Button -->
      <button id="toggle-capture-btn" class="primary-btn">
        <span class="btn-icon">▶</span>
        <span class="btn-text">Generate Subtitles</span>
      </button>

      <!-- Settings Grid -->
      <div class="control-group">
        <label for="language-select">Spoken Language</label>
        <select id="language-select" class="custom-select">
          <option value="auto">Auto Detect</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="hi">Hindi</option>
          <option value="ru">Russian</option>
          <option value="ar">Arabic</option>
        </select>
      </div>

      <div class="control-group">
        <label for="model-select">Quality & Speed</label>
        <select id="model-select" class="custom-select">
          <option value="tiny">Fast (Tiny Whisper)</option>
          <option value="base" selected>Balanced (Base Whisper)</option>
          <option value="small">High Accuracy (Small Whisper)</option>
        </select>
      </div>

      <!-- Time Offset Calibration -->
      <div class="control-group">
        <div class="label-row">
          <label>Subtitle Sync Offset</label>
          <span class="offset-val" id="offset-display">0.0s</span>
        </div>
        <div class="offset-controls">
          <button class="step-btn" id="offset-minus">-0.5s</button>
          <button class="step-btn reset-btn" id="offset-reset">Reset</button>
          <button class="step-btn" id="offset-plus">+0.5s</button>
        </div>
      </div>

      <!-- Advanced Connection Settings (Collapsible) -->
      <details class="server-details">
        <summary>Server Connection</summary>
        <div class="server-config">
          <label for="ws-url-input">WebSocket URL</label>
          <input type="text" id="ws-url-input" class="custom-input" value="ws://127.0.0.1:8000/ws/transcribe">
        </div>
      </details>
    </div>

    <!-- Tab 2: Subtitle Styles & Customization -->
    <div class="tab-content" id="tab-styles">
      <!-- Live Preview Window -->
      <div class="preview-card">
        <div class="preview-label">Live Preview</div>
        <div class="preview-screen" id="preview-screen">
          <div class="preview-cue" id="preview-cue">
            We need to leave right now.
          </div>
        </div>
      </div>

      <!-- Style Presets -->
      <div class="control-group">
        <label>Style Presets</label>
        <div class="preset-grid">
          <button class="preset-btn active" data-preset="netflix">Netflix</button>
          <button class="preset-btn" data-preset="classic">Classic</button>
          <button class="preset-btn" data-preset="highContrast">High Contrast</button>
          <button class="preset-btn" data-preset="accessible">Accessible</button>
        </div>
      </div>

      <!-- Custom Settings Controls -->
      <div class="custom-styles-section">
        <!-- Font Size Slider -->
        <div class="control-group">
          <div class="label-row">
            <label for="font-size-slider">Font Size</label>
            <span id="font-size-val">22px</span>
          </div>
          <input type="range" id="font-size-slider" min="14" max="38" value="22" class="custom-range">
        </div>

        <!-- Text Color -->
        <div class="control-group">
          <label>Text Color</label>
          <div class="color-picker-row">
            <div class="color-swatches">
              <button class="color-swatch active" style="background-color: #ffffff;" data-color="#ffffff"></button>
              <button class="color-swatch" style="background-color: #ffff00;" data-color="#ffff00"></button>
              <button class="color-swatch" style="background-color: #00ffff;" data-color="#00ffff"></button>
              <button class="color-swatch" style="background-color: #39ff14;" data-color="#39ff14"></button>
            </div>
            <input type="color" id="text-color-picker" value="#ffffff" class="native-color-picker">
          </div>
        </div>

        <!-- Background Opacity Slider -->
        <div class="control-group">
          <div class="label-row">
            <label for="bg-opacity-slider">Background Opacity</label>
            <span id="bg-opacity-val">75%</span>
          </div>
          <input type="range" id="bg-opacity-slider" min="0" max="100" value="75" class="custom-range">
        </div>

        <!-- Text Outline -->
        <div class="control-group">
          <label for="outline-select">Text Outline</label>
          <select id="outline-select" class="custom-select">
            <option value="none">None</option>
            <option value="thin">Thin Outline</option>
            <option value="medium">Medium Outline</option>
            <option value="thick">Thick Outline</option>
          </select>
        </div>

        <!-- Position -->
        <div class="control-group">
          <label for="position-select">Screen Position</label>
          <select id="position-select" class="custom-select">
            <option value="bottom" selected>Bottom</option>
            <option value="above-bottom">Above Bottom</option>
            <option value="center">Center</option>
            <option value="top">Top</option>
          </select>
        </div>

        <!-- Font Family -->
        <div class="control-group">
          <label for="font-family-select">Font Family</label>
          <select id="font-family-select" class="custom-select">
            <option value="sans-serif">Sans-Serif (Modern)</option>
            <option value="serif">Serif (Classic)</option>
            <option value="monospace">Monospace (Terminal)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
